name: Context hygiene

# Blocks private identifiers and machine-local paths from entering the public
# tree. Delegates to governance's reusable-context-hygiene.yml so the deny
# patterns and their base64 obfuscation live in one place instead of being
# copied per repository (fleet-pins.v1.yaml generation 9ac334cd, the current
# declared generation). All executable governance surfaces below consume the
# same declared generation as package.json and project.v1.yaml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context-hygiene:
    uses: libre-ai/governance/.github/workflows/reusable-context-hygiene.yml@9ac334cdf86cf05d126091f394d07c01d7745930
