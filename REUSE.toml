version = 1

# This repository carries no application and no product code: the READMEs are
# editorial documentation and first-party project records. Annotations follow
# the canonical policy in libre-ai/libre-ai/LICENSING.md; the last matching
# annotation wins within this file.
[[annotations]]
path = ["*.md", "**/*.md"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "CC-BY-4.0"

# First-party software by default: repository workflows and configuration,
# matching the canonical `.github/**` annotation.
[[annotations]]
path = [".github/**", ".gitignore", ".env.example"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "EUPL-1.2"

# Project state card (γ 3.6) — same licence as the repository doctrine.
[[annotations]]
path = ["project.v1.yaml"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "EUPL-1.2"

# Static publisher bootstrap (γ 3.6) — code EUPL-1.2 like the doctrine.
[[annotations]]
path = ["src/**", "package.json", "bun.lock", "bunfig.toml", "tsconfig.json", "biome.json", ".gitignore"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "EUPL-1.2"

# CDC migrated from the hub (γ 3.6) — documentation grant.
[[annotations]]
path = ["docs/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Libre AI contributors"
SPDX-License-Identifier = "CC-BY-4.0"
